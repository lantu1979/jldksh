  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a2e; 
        color: #e0e0e0; 
        overflow-x: hidden;
    }
    
    .main-container {
        display: flex;
        flex-direction: row;
        height: 100vh;
        width: 100%;
    }
    
    .three-container {
        flex: 1;
        position: relative;
        min-height: 400px;
    }
    
    .three-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
    }
    
    .control-panel {
        width: 380px;
        min-width: 340px;
        background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        border-left: 2px solid #e94560;
    }
    
    .panel-title {
        font-size: 20px;
        font-weight: 700;
        text-align: center;
        color: #e94560;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(233,69,96,0.3);
        letter-spacing: 2px;
    }
    
    .oscilloscope-container {
        background: #0a0a1a;
        border-radius: 12px;
        padding: 12px;
        border: 1px solid #333;
        box-shadow: 0 0 20px rgba(233,69,96,0.1);
    }
    
    .oscilloscope-label {
        font-size: 13px;
        color: #aaa;
        text-align: center;
        margin-bottom: 6px;
        font-weight: 600;
        letter-spacing: 1px;
    }
    
    #oscilloscope {
        width: 100%;
        border-radius: 8px;
        background: #050510;
    }
    
    .slider-group {
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        padding: 14px 16px;
        border: 1px solid rgba(255,255,255,0.08);
    }
    
    .slider-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 14px;
    }
    
    .slider-label .name {
        color: #ccc;
        font-weight: 600;
    }
    
    .slider-label .value {
        color: #e94560;
        font-weight: 700;
        font-size: 15px;
        min-width: 60px;
        text-align: right;
    }
    
    input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, #e94560, #533483);
        outline: none;
        cursor: pointer;
    }
    
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid #e94560;
        cursor: pointer;
        box-shadow: 0 0 8px rgba(233,69,96,0.5);
    }
    
    input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid #e94560;
        cursor: pointer;
    }
    
    .btn-toggle {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    
    .btn-toggle.running {
        background: linear-gradient(135deg, #e94560, #c0392b);
        color: white;
        box-shadow: 0 4px 15px rgba(233,69,96,0.4);
    }
    
    .btn-toggle.paused {
        background: linear-gradient(135deg, #27ae60, #2ecc71);
        color: white;
        box-shadow: 0 4px 15px rgba(46,204,113,0.4);
    }
    
    .btn-toggle:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(233,69,96,0.5);
    }
    
    .formula-display {
        background: rgba(0,0,0,0.3);
        border-radius: 10px;
        padding: 12px;
        text-align: center;
        border: 1px solid rgba(233,69,96,0.2);
    }
    
    .formula-display .formula {
        font-size: 16px;
        color: #f0c040;
        font-style: italic;
        font-weight: 600;
    }
    
    .formula-display .current-value {
        font-size: 13px;
        color: #aaa;
        margin-top: 6px;
    }
    
    .info-badge {
        display: inline-block;
        background: rgba(233,69,96,0.15);
        color: #e94560;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
    }
    
    .scene-overlay {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(0,0,0,0.6);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        color: #aaa;
        pointer-events: none;
        backdrop-filter: blur(4px);
    }
    
    .angle-display {
        position: absolute;
        bottom: 12px;
        left: 12px;
        background: rgba(0,0,0,0.7);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 14px;
        color: #f0c040;
        pointer-events: none;
        backdrop-filter: blur(4px);
    }
    
    @media (max-width: 900px) {
        .main-container {
            flex-direction: column;
            height: auto;
        }
        .three-container {
            height: 50vh;
            min-height: 300px;
        }
        .control-panel {
            width: 100%;
            min-width: unset;
            border-left: none;
            border-top: 2px solid #e94560;
            max-height: 50vh;
        }
    }
</style>

     </div><input type="range" id="sliderW" min="0.5" max="10.0" step="0.1" value="2.0">

  <script>
// ============ 全局变量声明 ============
var scene, camera, renderer, controls;
var coilGroup;
var isPaused = false;
var simulationTime = 0;
var lastFrameTime = 0;

// 物理参数
var paramB = 0.50;
var paramS = 0.50;
var paramN = 100;
var paramW = 2.0;

// 示波器数据
var waveData = [];
var maxWavePoints = 300;

// 3D 对象引用
var coilParts = [];
var magnetN, magnetS;

// 线圈基础尺寸
var baseCoilWidth = 2.0;
var baseCoilHeight = 1.5;

// ============ 初始化 Three.js 场景 ============
function initThreeScene() {
    var container = document.getElementById('threeContainer');
    var w = container.clientWidth;
    var h = container.clientHeight;
    
    // 场景
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.Fog(0x1a1a2e, 20, 50);
    
    // 相机
    camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
    camera.position.set(5, 4, 6);
    camera.lookAt(0, 0, 0);
    
    // 渲染器
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);
    
    // 轨道控制器
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 3;
    controls.maxDistance = 20;
    controls.target.set(0, 0, 0);
    
    // 灯光
    var ambientLight = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambientLight);
    
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);
    
    var dirLight2 = new THREE.DirectionalLight(0x6688cc, 0.3);
    dirLight2.position.set(-3, 4, -3);
    scene.add(dirLight2);
    
    var pointLight = new THREE.PointLight(0xe94560, 0.3, 15);
    pointLight.position.set(0, 3, 0);
    scene.add(pointLight);
    
    // 创建场景物体
    createGround();
    createMagnets();
    createMagneticFieldLines();
    createCoil();
    createAxis();
    
    // 窗口大小变化
    window.addEventListener('resize', onWindowResize, false);
}

// ============ 创建地面网格 ============
function createGround() {
    var gridHelper = new THREE.GridHelper(12, 24, 0x333355, 0x222244);
    gridHelper.position.y = -2.5;
    scene.add(gridHelper);
}

// ============ 创建坐标轴标识 ============
function createAxis() {
    // 旋转轴 (Z轴) 可视化
    var axisGeo = new THREE.CylinderGeometry(0.02, 0.02, 6, 8);
    var axisMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.4 });
    var axisMesh = new THREE.Mesh(axisGeo, axisMat);
    axisMesh.rotation.x = Math.PI / 2; // 沿Z轴
    scene.add(axisMesh);
    
    // Z轴标签 - 用小球标记
    var labelGeo = new THREE.SphereGeometry(0.08, 8, 8);
    var labelMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    var labelTop = new THREE.Mesh(labelGeo, labelMat);
    labelTop.position.set(0, 0, 3.2);
    scene.add(labelTop);
    var labelBot = new THREE.Mesh(labelGeo.clone(), labelMat.clone());
    labelBot.position.set(0, 0, -3.2);
    scene.add(labelBot);
}

// ============ 创建磁铁 ============
function createMagnets() {
    // N极 (红色) - 左侧 (-X)
    var nGeo = new THREE.BoxGeometry(0.8, 2.5, 2.5);
    var nMat = new THREE.MeshPhongMaterial({ 
        color: 0xcc2222, 
        emissive: 0x330000,
        specular: 0x444444,
        shininess: 60
    });
    magnetN = new THREE.Mesh(nGeo, nMat);
    magnetN.position.set(-3.5, 0, 0);
    magnetN.castShadow = true;
    scene.add(magnetN);
    
    // N极标签
    var nLabelGeo = new THREE.BoxGeometry(0.82, 0.6, 0.6);
    var nLabelMat = new THREE.MeshBasicMaterial({ color: 0xff4444 });
    var nLabel = new THREE.Mesh(nLabelGeo, nLabelMat);
    nLabel.position.set(-3.5, 0, 1.3);
    scene.add(nLabel);
    
    // S极 (蓝色) - 右侧 (+X)
    var sGeo = new THREE.BoxGeometry(0.8, 2.5, 2.5);
    var sMat = new THREE.MeshPhongMaterial({ 
        color: 0x2244cc, 
        emissive: 0x000033,
        specular: 0x444444,
        shininess: 60
    });
    magnetS = new THREE.Mesh(sGeo, sMat);
    magnetS.position.set(3.5, 0, 0);
    magnetS.castShadow = true;
    scene.add(magnetS);
    
    // S极标签
    var sLabelGeo = new THREE.BoxGeometry(0.82, 0.6, 0.6);
    var sLabelMat = new THREE.MeshBasicMaterial({ color: 0x4488ff });
    var sLabel = new THREE.Mesh(sLabelGeo, sLabelMat);
    sLabel.position.set(3.5, 0, 1.3);
    scene.add(sLabel);
}

// ============ 创建磁感线 ============
function createMagneticFieldLines() {
    var lineMat = new THREE.LineBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.25 });
    
    for (var j = -1; j <= 1; j += 1) {
        for (var k = -1; k <= 1; k += 1) {
            var points = [];
            points.push(new THREE.Vector3(-3.1, j * 0.7, k * 0.7));
            points.push(new THREE.Vector3(3.1, j * 0.7, k * 0.7));
            var lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            var line = new THREE.Line(lineGeo, lineMat);
            scene.add(line);
        }
    }
    
    // 箭头指示磁场方向 (N→S, -X → +X)
    var arrowGeo = new THREE.ConeGeometry(0.08, 0.25, 6);
    var arrowMat = new THREE.MeshBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.4 });
    for (var i = -1; i <= 1; i += 2) {
        var arrow = new THREE.Mesh(arrowGeo, arrowMat);
        arrow.position.set(i * 1.0, 0, 0);
        arrow.rotation.z = -Math.PI / 2; // 指向+X
        scene.add(arrow);
    }
}

// ============ 创建线圈 ============
function createCoil() {
    coilGroup = new THREE.Group();
    scene.add(coilGroup);
    
    buildCoilGeometry();
}

function buildCoilGeometry() {
    // 清除旧的线圈部件
    while (coilGroup.children.length > 0) {
        var child = coilGroup.children[0];
        coilGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
    }
    coilParts = [];
    
    // 根据面积参数计算线圈尺寸
    var scaleFactor = Math.sqrt(paramS / 0.5);
    var cw = baseCoilWidth * scaleFactor;  // 沿X方向的宽度
    var ch = baseCoilHeight * scaleFactor; // 沿Y方向的高度
    
    var tubeRadius = 0.04;
    var copperColor = 0xdd8833;
    var coilMat = new THREE.MeshPhongMaterial({
        color: copperColor,
        emissive: 0x331100,
        specular: 0xffcc88,
        shininess: 80
    });
    
    // 线圈由4条边组成矩形框
    // 线圈在 XY 平面内定义，然后整体绕Z轴旋转
    // 初始状态：线圈平面平行于XZ平面（平放），所以需要初始旋转
    
    var hw = cw / 2;
    var hh = ch / 2;
    
    // 上边 (沿X方向)
    var topGeo = new THREE.CylinderGeometry(tubeRadius, tubeRadius, cw, 8);
    var topBar = new THREE.Mesh(topGeo, coilMat);
    topBar.rotation.z = Math.PI / 2;
    topBar.position.set(0, hh, 0);
    coilGroup.add(topBar);
    coilParts.push(topBar);
    
    // 下边 (沿X方向)
    var botGeo = new THREE.CylinderGeometry(tubeRadius, tubeRadius, cw, 8);
    var botBar = new THREE.Mesh(botGeo, coilMat);
    botBar.rotation.z = Math.PI / 2;
    botBar.position.set(0, -hh, 0);
    coilGroup.add(botBar);
    coilParts.push(botBar);
    
    // 左边 (沿Y方向)
    var leftGeo = new THREE.CylinderGeometry(tubeRadius, tubeRadius, ch, 8);
    var leftBar = new THREE.Mesh(leftGeo, coilMat);
    leftBar.position.set(-hw, 0, 0);
    coilGroup.add(leftBar);
    coilParts.push(leftBar);
    
    // 右边 (沿Y方向)
    var rightGeo = new THREE.CylinderGeometry(tubeRadius, tubeRadius, ch, 8);
    var rightBar = new THREE.Mesh(rightGeo, coilMat);
    rightBar.position.set(hw, 0, 0);
    coilGroup.add(rightBar);
    coilParts.push(rightBar);
    
    // 添加线圈平面半透明填充，帮助可视化
    var planeGeo = new THREE.PlaneGeometry(cw, ch);
    var planeMat = new THREE.MeshPhongMaterial({
        color: 0xdd8833,
        transparent: true,
        opacity: 0.15,
        side: THREE.DoubleSide,
        depthWrite: false
    });
    var planeMesh = new THREE.Mesh(planeGeo, planeMat);
    coilGroup.add(planeMesh);
    
    // 添加法线箭头指示
    var arrowLen = 1.0;
    var arrowGeo = new THREE.ConeGeometry(0.06, 0.2, 6);
    var arrowMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
    var arrowMesh = new THREE.Mesh(arrowGeo, arrowMat);
    arrowMesh.position.set(0, 0, arrowLen);
    arrowMesh.rotation.x = Math.PI / 2;
    coilGroup.add(arrowMesh);
    
    var arrowLineGeo = new THREE.CylinderGeometry(0.015, 0.015, arrowLen, 6);
    var arrowLineMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
    var arrowLine = new THREE.Mesh(arrowLineGeo, arrowLineMat);
    arrowLine.rotation.x = Math.PI / 2;
    arrowLine.position.set(0, 0, arrowLen / 2);
    coilGroup.add(arrowLine);
    
    // 初始状态：线圈平面平行于XZ平面（平放）
    // 线圈在XY平面内定义，法线沿Z。要让平面平行于XZ，需要绕X轴旋转90度
    // 这样法线就指向Y方向，线圈平面在XZ平面
    // 然后绕Z轴旋转就是物理上的旋转
    
    // 实际上，我们需要线圈绕Z轴旋转。
    // 磁场沿X轴。线圈法线初始应垂直于X轴（即沿Y或Z），
    // 使得初始时线圈平面包含X轴（平行于磁感线），磁通量变化率最大。
    
    // 线圈定义在XY平面，法线沿Z。
    // 初始时要让线圈平面平行于磁场（沿X），即法线⊥X轴。
    // 法线沿Z已经⊥X轴了。但"平放"意味着线圈平面平行于XZ平面。
    // 所以需要让线圈绕X轴转90度，使其在XZ平面内，法线沿Y。
    
    // 不对，让我重新思考。
    // 要求：线圈绕Z轴旋转。初始时线圈平面平行于XZ平面（水平面）。
    // 磁场沿X轴。
    // 线圈平面平行于XZ平面时，法线沿Y轴，与磁场(X轴)垂直，
    // 此时磁通量 Φ = B·S·cos(angle between n and B) = B·S·cos(90°) = 0
    // 但磁通量变化率最大，所以 e 最大。符合 cos 形式。
    
    // coilGroup 内部线圈在 XY 平面。
    // 要让初始时线圈在 XZ 平面，需要绕 X 轴旋转 90°。
    // 但旋转是绕 Z 轴的，所以我们不能简单地设置 coilGroup.rotation.x。
    
    // 更好的方案：在 coilGroup 内部再套一层 group 做初始姿态调整。
    // 或者直接在 XZ 平面内构建线圈。
    
    // 让我重新构建：直接在 XZ 平面内构建线圈，法线沿 Y。
    // 这样初始时线圈就是"平放"的，绕 Z 轴旋转即可。
    
    // 清除刚才的，重新来
    while (coilGroup.children.length > 0) {
        var child2 = coilGroup.children[0];
        coilGroup.remove(child2);
        if (child2.geometry) child2.geometry.dispose();
        if (child2.material) child2.material.dispose();
    }
    coilParts = [];
    
    // 在 XZ 平面内构建矩形线圈
    // 四条边：
    // 前边 (沿X, z=+hh): 从(-hw,0,hh)到(hw,0,hh)
    // 后边 (沿X, z=-hh): 从(-hw,0,-hh)到(hw,0,-hh)
    // 左边 (沿Z, x=-hw): 从(-hw,0,-hh)到(-hw,0,hh)
    // 右边 (沿Z, x=hw): 从(hw,0,-hh)到(hw,0,hh)
    
    var coilMat2 = new THREE.MeshPhongMaterial({
        color: copperColor,
        emissive: 0x331100,
        specular: 0xffcc88,
        shininess: 80
    });
    
    // 前边 (沿X方向)
    var frontGeo = new THREE.CylinderGeometry(tubeRadius, tubeRadius, cw, 8);
    var frontBar = new THREE.Mesh(frontGeo, coilMat2);
    frontBar.rotation.z = Math.PI / 2; // CylinderGeometry 默认沿Y，旋转到沿X
    frontBar.position.set(0, 0, hh);
    coilGroup.add(frontBar);
    coilParts.push(frontBar);
    
    // 后边 (沿X方向)
    var backGeo = new THREE.CylinderGeometry(tubeRadius, tubeRadius, cw, 8);
    var backBar = new THREE.Mesh(backGeo, coilMat2.clone());
    backBar.rotation.z = Math.PI / 2;
    backBar.position.set(0, 0, -hh);
    coilGroup.add(backBar);
    coilParts.push(backBar);
    
    // 左边 (沿Z方向)
    var leftGeo2 = new THREE.CylinderGeometry(tubeRadius, tubeRadius, ch, 8);
    var leftBar2 = new THREE.Mesh(leftGeo2, coilMat2.clone());
    leftBar2.rotation.x = Math.PI / 2; // 旋转到沿Z
    leftBar2.position.set(-hw, 0, 0);
    coilGroup.add(leftBar2);
    coilParts.push(leftBar2);
    
    // 右边 (沿Z方向)
    var rightGeo2 = new THREE.CylinderGeometry(tubeRadius, tubeRadius, ch, 8);
    var rightBar2 = new THREE.Mesh(rightGeo2, coilMat2.clone());
    rightBar2.rotation.x = Math.PI / 2;
    rightBar2.position.set(hw, 0, 0);
    coilGroup.add(rightBar2);
    coilParts.push(rightBar2);
    
    // 半透明平面 (在XZ平面)
    var planeGeo2 = new THREE.PlaneGeometry(cw, ch);
    var planeMat2 = new THREE.MeshPhongMaterial({
        color: 0xdd8833,
        transparent: true,
        opacity: 0.12,
        side: THREE.DoubleSide,
        depthWrite: false
    });
    var planeMesh2 = new THREE.Mesh(planeGeo2, planeMat2);
    planeMesh2.rotation.x = -Math.PI / 2; // PlaneGeometry 默认在XY，旋转到XZ
    coilGroup.add(planeMesh2);
    
    // 法线箭头 (初始沿Y轴，即法线方向)
    var nArrowLen = 1.2;
    var nArrowGeo = new THREE.ConeGeometry(0.07, 0.25, 8);
    var nArrowMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
    var nArrowMesh = new THREE.Mesh(nArrowGeo, nArrowMat);
    nArrowMesh.position.set(0, nArrowLen, 0);
    coilGroup.add(nArrowMesh);
    
    var nArrowLineGeo = new THREE.CylinderGeometry(0.02, 0.02, nArrowLen, 6);
    var nArrowLineMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
    var nArrowLineMesh = new THREE.Mesh(nArrowLineGeo, nArrowLineMat);
    nArrowLineMesh.position.set(0, nArrowLen / 2, 0);
    coilGroup.add(nArrowLineMesh);
    
    // 旋转轴上的小环（装饰）
    var ringGeo = new THREE.TorusGeometry(0.12, 0.025, 8, 16);
    var ringMat = new THREE.MeshPhongMaterial({ color: 0x888888, specular: 0xffffff, shininess: 100 });
    var ring1 = new THREE.Mesh(ringGeo, ringMat);
    ring1.position.set(0, 0, hh + 0.15);
    coilGroup.add(ring1);
    var ring2 = new THREE.Mesh(ringGeo.clone(), ringMat.clone());
    ring2.position.set(0, 0, -hh - 0.15);
    coilGroup.add(ring2);
}

// ============ 示波器绘制 ============
function drawOscilloscope() {
    var canvas = document.getElementById('oscilloscope');
    var ctx = canvas.getContext('2d');
    var w = canvas.width;
    var h = canvas.height;
    
    // 清除
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, w, h);
    
    // 网格线
    ctx.strokeStyle = 'rgba(100, 100, 150, 0.15)';
    ctx.lineWidth = 0.5;
    for (var i = 0; i < 10; i++) {
        var gx = (w / 10) * i;
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, h);
        ctx.stroke();
    }
    for (var j = 0; j < 8; j++) {
        var gy = (h / 8) * j;
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(w, gy);
        ctx.stroke();
    }
    
    // 中心线 (零线)
    ctx.strokeStyle = 'rgba(150, 150, 200, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    ctx.lineTo(w, h / 2);
    ctx.stroke();
    ctx.setLineDash([]);
    
    // 计算最大振幅用于自适应缩放
    var peakAmplitude = paramN * paramB * paramS * paramW;
    if (peakAmplitude < 0.01) peakAmplitude = 0.01;
    
    // 绘制波形
    if (waveData.length > 1) {
        // 发光效果
        ctx.shadowColor = '#e94560';
        ctx.shadowBlur = 8;
        
        ctx.strokeStyle = '#e94560';
        ctx.lineWidth = 2;
        ctx.beginPath();
        
        var startIdx = Math.max(0, waveData.length - maxWavePoints);
        var pointCount = waveData.length - startIdx;
        
        for (var k = 0; k < pointCount; k++) {
            var px = (k / maxWavePoints) * w;
            var val = waveData[startIdx + k];
            var py = h / 2 - (val / peakAmplitude) * (h / 2 - 15);
            
            if (k === 0) {
                ctx.moveTo(px, py);
            } else {
                ctx.lineTo(px, py);
            }
        }
        ctx.stroke();
        
        ctx.shadowBlur = 0;
        
        // 当前值标记点
        if (pointCount > 0) {
            var lastPx = ((pointCount - 1) / maxWavePoints) * w;
            var lastVal = waveData[waveData.length - 1];
            var lastPy = h / 2 - (lastVal / peakAmplitude) * (h / 2 - 15);
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(lastPx, lastPy, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            ctx.arc(lastPx, lastPy, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // 坐标轴标签
    ctx.font = '12px monospace';
    ctx.fillStyle = '#888';
    
    // Y轴标签
    ctx.fillText('e', 4, 14);
    ctx.fillText('+' + peakAmplitude.toFixed(0), 4, 26);
    ctx.fillText('-' + peakAmplitude.toFixed(0), 4, h - 6);
    ctx.fillText('0', 4, h / 2 - 4);
    
    // X轴标签
    ctx.fillText('t →', w - 30, h - 6);
    
    // 单位
    ctx.fillStyle = '#555';
    ctx.font = '10px monospace';
    ctx.fillText('V', 20, 14);
}

// ============ 窗口大小变化处理 ============
function onWindowResize() {
    var container = document.getElementById('threeContainer');
    var w = container.clientWidth;
    var h = container.clientHeight;
    
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
}

// ============ 暂停/继续 ============
function togglePause() {
    isPaused = !isPaused;
    var btn = document.getElementById('btnToggle');
    if (isPaused) {
        btn.textContent = '▶ 继续';
        btn.className = 'btn-toggle paused';
    } else {
        btn.textContent = '⏸ 暂停';
        btn.className = 'btn-toggle running';
    }
}

// ============ 滑块事件绑定 ============
function setupSliders() {
    var sliderB = document.getElementById('sliderB');
    var sliderS = document.getElementById('sliderS');
    var sliderN = document.getElementById('sliderN');
    var sliderW = document.getElementById('sliderW');
    
    sliderB.addEventListener('input', function() {
        paramB = parseFloat(this.value);
        document.getElementById('bValue').textContent = paramB.toFixed(2) + ' T';
    });
    
    sliderS.addEventListener('input', function() {
        paramS = parseFloat(this.value);
        document.getElementById('sValue').textContent = paramS.toFixed(2) + ' m²';
        // 联动改变3D线圈大小
        buildCoilGeometry();
    });
    
    sliderN.addEventListener('input', function() {
        paramN = parseInt(this.value);
        document.getElementById('nValue').textContent = paramN;
    });
    
    sliderW.addEventListener('input', function() {
        paramW = parseFloat(this.value);
        document.getElementById('wValue').textContent = paramW.toFixed(2) + ' rad/s';
    });
}

// ============ 主渲染循环 ============
function animate(timestamp) {
    requestAnimationFrame(animate);
    
    if (!lastFrameTime) lastFrameTime = timestamp;
    var deltaTime = (timestamp - lastFrameTime) / 1000;
    lastFrameTime = timestamp;
    
    // 限制 deltaTime 防止跳帧
    if (deltaTime > 0.1) deltaTime = 0.016;
    
    if (!isPaused) {
        simulationTime += deltaTime;
        
        // 更新线圈旋转 (绕Z轴)
        // 初始时线圈在XZ平面（平放），法线沿Y
        // 绕Z轴旋转角度 = ω * t
        var angle = paramW * simulationTime;
        coilGroup.rotation.z = angle;
        
        // 计算瞬时电动势
        // e = N * B * S * ω * cos(ωt)
        // 初始时(t=0)，线圈平面平行于磁场(XZ平面包含X轴方向的磁场)
        // 法线沿Y，与B(沿X)垂直，Φ=0，dΦ/dt最大，e最大
        var e = paramN * paramB * paramS * paramW * Math.cos(angle);
        
        // 推入波形数据
        waveData.push(e);
        if (waveData.length > maxWavePoints + 50) {
            waveData = waveData.slice(waveData.length - maxWavePoints);
        }
        
        // 更新公式显示
        document.getElementById('formulaValue').textContent = 'e = ' + e.toFixed(2) + ' V';
        
        // 更新角度显示
        var angleDeg = ((angle * 180 / Math.PI) % 360).toFixed(1);
        if (angleDeg < 0) angleDeg = (parseFloat(angleDeg) + 360).toFixed(1);
        var flux = paramB * paramS * Math.sin(angle); // Φ = BS·sin(θ) 因为法线与B的夹角 = 90°-θ 时... 
        // 实际上：法线初始沿Y，B沿X。旋转角θ后，法线与X轴夹角 = 90°-θ
        // Φ = B*S*cos(90°-θ) = B*S*sin(θ)
        var fluxVal = paramB * paramS * Math.sin(angle);
        document.getElementById('angleDisplay').textContent = 
            'θ = ' + angleDeg + '° | Φ = ' + fluxVal.toFixed(3) + ' Wb | e = ' + e.toFixed(1) + ' V';
    }
    
    // 绘制示波器
    drawOscilloscope();
    
    // 更新控制器
    controls.update();
    
    // 渲染3D场景
    renderer.render(scene, camera);
}

// ============ 初始化 ============
function init() {
    initThreeScene();
    setupSliders();
    
    // 启动渲染循环
    lastFrameTime = 0;
    requestAnimationFrame(animate);
}

// 页面加载完成后初始化
window.addEventListener('DOMContentLoaded', init);
</script>
